name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  id-token: write

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace -- -D warnings

      - name: Test
        run: cargo test --workspace

  version:
    name: Compute version
    needs: check
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.calc.outputs.version }}
      tag: ${{ steps.calc.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine version
        id: calc
        run: |
          COUNT=$(git rev-list --count HEAD)
          VERSION="0.1.${COUNT}"
          TAG="v${VERSION}"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "Version: ${VERSION}, Tag: ${TAG}"

  build:
    name: Build ${{ matrix.target }}
    needs: version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: eci-linux-x86_64
            archive: eci-linux-x86_64.tar.gz
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: eci-linux-aarch64
            archive: eci-linux-aarch64.tar.gz
          - target: armv7-unknown-linux-gnueabihf
            os: ubuntu-latest
            artifact: eci-linux-armv7
            archive: eci-linux-armv7.tar.gz
          - target: i686-unknown-linux-gnu
            os: ubuntu-latest
            artifact: eci-linux-i686
            archive: eci-linux-i686.tar.gz

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ matrix.target }}-

      - name: Install cross-compilation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config cmake perl
          case "${{ matrix.target }}" in
            aarch64-*)
              sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
              echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> $GITHUB_ENV
              echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER=aarch64-linux-gnu-gcc" >> $GITHUB_ENV
              ;;
            armv7-*)
              sudo apt-get install -y gcc-arm-linux-gnueabihf g++-arm-linux-gnueabihf
              echo "CARGO_TARGET_ARMV7_UNKNOWN_LINUX_GNUEABIHF_LINKER=arm-linux-gnueabihf-gcc" >> $GITHUB_ENV
              ;;
            i686-*)
              sudo apt-get install -y gcc-multilib g++-multilib
              echo "CARGO_TARGET_I686_UNKNOWN_LINUX_GNU_LINKER=gcc" >> $GITHUB_ENV
              ;;
          esac

      - name: Build
        run: cargo build --release --target ${{ matrix.target }} -p eci

      - name: Package
        run: |
          cp target/${{ matrix.target }}/release/eci ${{ matrix.artifact }}
          chmod +x ${{ matrix.artifact }}
          tar czf ${{ matrix.archive }} ${{ matrix.artifact }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: ${{ matrix.archive }}

  release:
    name: Create release
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: ${{ needs.version.outputs.tag }}
          generate_release_notes: true
          body: |
            ## easy-ci ${{ needs.version.outputs.tag }}

            ### Install via script (recommended)
            ```bash
            curl -fsSL https://raw.githubusercontent.com/deyoyk/easy-ci/main/install.sh | bash
            ```

            ### Manual download
            Download the appropriate binary for your platform from the assets below.

            | Architecture | Archive |
            |-------------|---------|
            | x86_64 | `eci-linux-x86_64.tar.gz` |
            | ARM64 | `eci-linux-aarch64.tar.gz` |
            | ARMv7 | `eci-linux-armv7.tar.gz` |
            | i686 | `eci-linux-i686.tar.gz` |
          files: artifacts/*

  docker:
    name: Build Docker image
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download Linux x86_64 binary
        uses: actions/download-artifact@v4
        with:
          name: eci-linux-x86_64.tar.gz
          path: .

      - name: Extract binary
        run: |
          tar xzf eci-linux-x86_64.tar.gz
          chmod +x eci-linux-x86_64
          mv eci-linux-x86_64 eci

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            deyoyk/eci:${{ needs.version.outputs.version }}
            deyoyk/eci:latest
          platforms: linux/amd64
